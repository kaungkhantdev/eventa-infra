apiVersion: v2
name: checkin
# The dedicated check-in pool from devops-infrastructure.md §3.2: the SAME `api`
# image in its own Deployment and HPA, so a door-scanning surge during a live
# event autoscales and fails independently of the browse/checkout traffic the
# main api pool serves. The isolation is the deliverable — one tenant's on-site
# rush cannot starve another tenant's checkout.
description: The Eventa door-scan API pool — the api image in its own Deployment and HPA, isolated from checkout traffic.
type: application
version: 0.1.0
# No appVersion on purpose. What is deployed is the immutable SHA tag that the
# CI bot writes into values-<env>.yaml (devops-ci-cd.md §3, devops-infrastructure.md
# §1.2), and a second version number here would be a copy that goes stale the
# first time an environment is promoted without touching this file.
dependencies:
  # Every object this chart renders comes from the shared library chart, which is
  # what devops-infrastructure.md §1.2 asks for: probes, HPA, PDB, NetworkPolicy
  # and ExternalSecret live in one place so the five workloads cannot drift
  # apart. This chart contributes values and five guards, no object templates.
  #
  # `file://` resolves inside this repository, so `helm dependency build` works
  # for Argo CD and in CI without a chart museum. The vendored tarball under
  # charts/ is gitignored; Chart.lock pins it.
  - name: eventa-library
    version: 0.1.0
    repository: "file://../_library"
keywords:
  - eventa
  - checkin
  - api
home: https://github.com/eventa/eventa-infra
sources:
  - https://github.com/eventa/eventa-infra
maintainers:
  - name: Eventa Platform Squad
annotations:
  # The documents this chart implements. Anything below that looks like a free
  # design choice is not one — read these before changing a value.
  eventa.io/spec: |
    eventa-docs/07-deployment/devops-infrastructure.md §1.2, §3.1, §3.2, §3.3, §5, §6, §7
    eventa-docs/07-deployment/devops-ci-cd.md §3, §4.2, §4.3, §5.1
    eventa-docs/08-maintenance/devops-observability-sre.md §1
  # Argo CD ordering. devops-ci-cd.md §4.3 fixes the waves: (1) the migration
  # pre-deploy Job, (2) api/worker/relay, (3) web. §4.3 does not list `checkin`
  # separately because it is the api image — and it belongs in wave 2 for
  # exactly that reason: it must not start against an un-migrated schema.
  eventa.io/sync-wave: "2"
