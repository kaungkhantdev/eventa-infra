apiVersion: v2
name: eventa-library
# A library chart renders nothing on its own: it only exports named templates
# that the five service charts (web, api, worker, relay, checkin) include. The
# point is the one named in devops-infrastructure.md §1.2 — probes, PDB,
# NetworkPolicy, ExternalSecret and HPA live in one place so the five workloads
# cannot drift apart.
type: library
version: 0.1.0
description: Shared Helm templates for the five Eventa workloads — Deployment skeleton, probes, HPA, PDB, NetworkPolicy, ExternalSecret and the gated migration Job.
keywords:
  - eventa
  - library
home: https://github.com/eventa/eventa-infra
sources:
  - https://github.com/eventa/eventa-infra
maintainers:
  - name: Eventa Platform Squad
annotations:
  # The documents this chart implements. Anything here that looks like a free
  # design choice is not one — read these before changing a default.
  eventa.io/spec: |
    eventa-docs/07-deployment/devops-infrastructure.md §1.2, §3.1, §3.2, §3.3, §5, §6, §7
    eventa-docs/07-deployment/devops-ci-cd.md §4.2, §4.3, §5.1, §5.3
    eventa-docs/08-maintenance/devops-observability-sre.md §1
