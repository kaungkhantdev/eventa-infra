# worker — staging (namespace `eventa-staging`, devops-infrastructure.md §3.1/§7).
#
# §7 makes staging prod-like on purpose: DAST, perf and migration rehearsal only
# mean anything against production's own configuration. So this file deliberately
# does NOT lower the log level's cousins — NODE_ENV stays `production`, which
# keeps eventa-worker's two production refusals armed
# (src/config/env.validation.ts:148, :182) and keeps the mail path identical to
# prod's. What differs is the data, the credentials and the ceiling.
#
# UAT does NOT use this file. `./values-uat.yaml` now exists and
# `../../../argocd/environments/uat/worker.yaml` names it in its `valueFiles`,
# so that Application renders its own overlay. This header previously said UAT
# "syncs this file with `/eventa/uat/worker` overridden by its Argo CD
# Application", which was never true of any arrangement in this repo: that
# Application carries no `helm.parameters`, and neither does any other
# Application under `argocd/` — §1.2 makes the values file the unit of
# deployment, so there is no mechanism by which an Application could substitute
# a secret path for a chart. Before the overlay existed it simply reported a
# missing values file.
#
# UAT derives FROM this file rather than sharing it, because §7 makes staging
# the nearest parity environment. What values-uat.yaml changes is what §7 allows
# — "sizing, replica counts, retention, and data sensitivity" — plus the
# coordinates; most visibly it declines staging's `LOG_LEVEL: debug`, since
# UAT's data is curated realistic and masked rather than anonymised.

environment: staging

image:
  # ci-cd §4.1: staging auto-promotes after dev is healthy, so the bot moves
  # this line without a human. See values-prod.yaml for the placeholder.
  tag: sha-0000000

serviceAccount:
  # `/eventa/staging/*` only — see values-prod.yaml.
  annotations: {}

externalSecret:
  dataFrom:
    - extract:
        key: /eventa/staging/worker

config:
  env:
    # §7 runs DAST and perf here, both of which read logs to explain a failure.
    LOG_LEVEL: debug
    # ci-cd §1.1 sends staging's mail to a sink rather than to attendees, and
    # §7 forbids raw production PII here — a masked dataset mailed to real
    # addresses would defeat both. The sink's hostname and credentials arrive at
    # `/eventa/staging/worker` as SMTP_HOST/USER/PASSWORD, so swapping sinks is a
    # secrets-manager change and not a chart change.
    #
    # NOTE if the sink is moved in-cluster (Mailpit rather than a hosted
    # trap): `networkPolicy.egress.external` carves out every private range, so
    # it will NOT reach a pod. Replace it with a `networkPolicy.egress.toPods`
    # entry naming the sink's namespace and port.
    #
    # The domain is `eventa.dev`, which devops-ci-cd.md §1.1 names for preview
    # environments and which ../web/values-staging.yaml serves staging on. It
    # used to read `eventa.co.th`, a domain that appears in eventa-docs only as
    # fixture data (06-testing/test-cases.md:503) and that web has never served
    # — so the sender and the links below named a host nothing in this
    # repository deploys.
    EMAIL_FROM: Eventa Staging <no-reply@staging.eventa.dev>
    # Links in staging mail should land on staging, so a tester following one
    # from the sink does not end up acting on production. It has to be
    # ../web/values-staging.yaml's Ingress host exactly. Same caveat as prod:
    # mail from this domain is only delivered once the provider holds SPF and
    # DKIM records for it (see values-prod.yaml).
    PUBLIC_WEB_URL: https://staging.eventa.dev

hpa:
  # minReplicas stays at the baseline 2. §8 lowers non-prod replica COUNTS, and
  # this is where that happens — at the ceiling, not the floor. Two reasons the
  # floor does not move: devops-observability-sre.md §7.2 asks for "≥ 2 replicas
  # per Deployment" without carving out non-prod, and §3.3's `minAvailable: 50%`
  # against a floor of 1 rounds up to 1, leaving zero voluntary disruptions — so
  # every node drain in this namespace would block until somebody deleted the
  # pod by hand, which is the trap the relay chart has to live with and this one
  # does not.
  maxReplicas: 4

# The data subnets for eventa-staging: 10.<env>.<az>.0/24 with the env octet 20,
# and AZ 1 alone because §8 runs the non-production environments on single-node
# data services. The scheme, shared by all five charts, is in values.yaml.
# PLACEHOLDER — the network module's output for this environment (§1.1), which
# does not exist yet; see values-prod.yaml for what a wrong value costs.
global:
  eventa:
    network:
      postgresCidrs:
        - 10.20.1.0/24
      redisCidrs:
        - 10.20.1.0/24
      rabbitmqCidrs:
        - 10.20.1.0/24
