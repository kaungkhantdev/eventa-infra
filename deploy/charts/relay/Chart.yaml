apiVersion: v2
name: relay
# The transactional outbox publisher: it reads eventa-api's `outbox_events` and
# publishes each row to RabbitMQ with publisher confirms. It is the bridge
# between a committed database transaction and an asynchronous side effect, so
# when it stops, orders keep succeeding and no email leaves the platform.
description: Eventa outbox relay — publishes eventa-api's transactional outbox to RabbitMQ. Pinned to exactly one replica.
type: application
version: 0.1.0
# The service's own version (eventa-relay/package.json). What actually runs is
# the SHA-tagged image an environment pins, never this string — devops-ci-cd.md
# §3 makes the git SHA the deployable identity — so this is only a label.
appVersion: "0.1.0"

dependencies:
  # Every shared object this chart renders comes from the library chart, so a
  # change to a probe or a disruption budget happens once for all five workloads
  # (devops-infrastructure.md §1.2). This chart contributes values plus
  # templates/_guard.tpl, which adds two refusals of its own on top of the
  # library's: `singleton.enabled: false`, and `migrationJob.enabled: true`.
  - name: eventa-library
    version: 0.1.0
    repository: "file://../_library"

keywords:
  - eventa
  - outbox
  - rabbitmq
home: https://github.com/eventa/eventa-infra
sources:
  - https://github.com/eventa/eventa-infra
maintainers:
  - name: Eventa Platform Squad

annotations:
  # The documents this chart implements. Anything below that looks like a free
  # choice is not one — read these before changing a value.
  eventa.io/spec: |
    eventa-docs/07-deployment/devops-infrastructure.md §1.2, §3.1, §3.2, §3.3, §5, §6, §7
    eventa-docs/07-deployment/devops-ci-cd.md §4.2, §4.3, §5.1, §5.3
    eventa-docs/08-maintenance/devops-observability-sre.md §1, §2
  # Every place this chart does not do what a document says, and the source that
  # settles each one. See README.md and templates/_guard.tpl. The replica count
  # is the only one where the document is wrong; the rest are places where a
  # document asks for something eventa-relay cannot yet support, or groups the
  # relay with services whose needs it does not share.
  eventa.io/spec-deviations: |
    1. REPLICA COUNT — the document is wrong.
       devops-infrastructure.md §3.2 tabulates relay at a minimum of 2 replicas.
       eventa-relay/src/relay/outbox-reader.repository.ts:25 selects pending rows
       with no FOR UPDATE SKIP LOCKED, so a second replica publishes every event
       twice. This chart pins one replica and fails to render if anyone raises it.
    2. NO HPA — the same defect, in three more entries.
       devops-infrastructure.md §3.2 gives relay the signal "CPU + outbox lag",
       §6 lists "queue depth (worker/relay)" and "relay scales with outbox lag",
       and devops-ci-cd.md §0 tabulates relay as "1 Deployment + HPA
       (singleton-safe)". This chart ships no HPA and fails the render on
       hpa.enabled=true: until the reader claims rows, an autoscaler's only job
       would be to create the replica that must not exist. Outbox lag is still
       the signal to watch — it wakes a human instead (observability §2).
    3. NO /metrics — the image cannot serve it.
       devops-observability-sre.md §1 scrapes all 5 workloads via /metrics.
       eventa-relay/src/main.ts:24 creates an application context, not a server:
       there is no listen, no controller and no port, so there is nothing to
       scrape. §2 anticipates this and sources outbox lag from a "relay gauge /
       DB query exporter" instead.
    4. NO PROBES — the image does not ship the check the spec asks for.
       devops-infrastructure.md §3.3 sends workers/relay to exec/TCP checks plus
       broker-connection health, and devops-ci-cd.md §4.3 wants every workload to
       define startup, readiness and liveness. eventa-relay has no health module
       and no CLI entrypoint; with maxSurge 0, an exec probe pointed at an absent
       command would leave ZERO publishers on every deploy. See README.md.
    5. NO REDIS EGRESS — the grouping does not fit.
       devops-infrastructure.md §3.3 groups "api/checkin/worker/relay →
       Postgres/Redis/RabbitMQ". eventa-relay's env schema has no REDIS_URL and
       the service holds no cache, session or idempotency state
       (eventa-relay/src/config/env.validation.ts:11-27), and §3.3's own rule is
       that nothing undeclared is permitted.
  # What needs correcting upstream in eventa-docs, which is read-only from this
  # repo. eventa-infra/README.md, warning 4, carries the full list.
  eventa.io/upstream-corrections: |
    devops-infrastructure.md §3.2 (relay row: min replicas, scaling signal)
    devops-infrastructure.md §6 (Pods row, Consumers row)
    devops-ci-cd.md §0 (relay row: "+ HPA (singleton-safe)")
    devops-observability-sre.md §1 (Metrics row: "all 5 workloads via /metrics")
    devops-infrastructure.md §3.3 (NetworkPolicy allows: relay needs no Redis)
