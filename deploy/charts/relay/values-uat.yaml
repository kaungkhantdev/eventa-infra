# relay — UAT (namespace `eventa-uat`, devops-infrastructure.md §3.1/§7).
#
# Business acceptance, promoted by manual approval from product and QA
# (devops-ci-cd.md §4.1), on curated and masked data. §7 lists four parity
# environments, not three — without this file the relay simply has no UAT
# deployment, and the outbox is what carries every confirmation email a
# stakeholder would be accepting.
#
# Like staging it differs from the production baseline only in its references.

image:
  # Gated promotion: the identical digest that passed staging (devops-ci-cd.md
  # §3, §4.1). PLACEHOLDER; see values-prod.yaml.
  tag: sha-0000000

environment: uat

externalSecret:
  # §5: `/eventa/uat/*`.
  dataFrom:
    - extract:
        key: /eventa/uat/relay

# The data subnets for eventa-uat: 10.<env>.<az>.0/24 with the env octet 30, and
# AZ 1 alone because §8 runs non-production on single-node data services. The
# scheme, shared by all five charts, is in values.yaml. PLACEHOLDER — the
# Terraform network module's output for this environment (§1.1).
#
# The octet matters here more than anywhere: this file used to carry 10.30.3.0/24
# while ../api/values-prod.yaml carried 10.30.x for PRODUCTION, so one range
# named UAT's database and production's at once. The scheme now gives 30 to UAT
# and 40 to production, in all five charts.
global:
  eventa:
    network:
      postgresCidrs:
        - 10.30.1.0/24
      rabbitmqCidrs:
        - 10.30.1.0/24
