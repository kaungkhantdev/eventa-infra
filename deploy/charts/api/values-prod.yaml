# api — production (namespace `eventa-prod`, devops-infrastructure.md §3.1/§7).
#
# This file holds only what production *is*, not how it is sized: the sizing in
# values.yaml already is the prod baseline from §3.2/§3.3, so repeating
# `minReplicas: 3` or the resource block here would create a second place for it
# to drift. What is here is the set of coordinates that only exist once an
# environment exists — the image reference, the data-subnet CIDRs, the secret
# path, the hostname, the Prometheus address.
#
# PLACEHOLDERS. The values tagged below do not exist yet: this repo has no
# `terraform/`, no cloud account is provisioned, and §1.1 deliberately names no
# provider. Each one is the output of a named Terraform module and has to be
# filled in by the run that creates it. They are written as syntactically valid
# values rather than left blank because the library refuses to render an empty
# CIDR list — a NetworkPolicy rule with no peer allows every destination
# instead of none (§3.3) — so a blank would be the one mistake that fails open.

# Names the environment on every log line, span and metric
# (devops-observability-sre.md §1) instead of letting it default to the
# namespace, which would tag production telemetry `eventa-prod`.
environment: prod

image:
  # PLACEHOLDER. Owned by the bot, not by a human: CI builds and signs the
  # image, then commits the pinned reference into this file for the target
  # environment (devops-infrastructure.md §1.3, devops-ci-cd.md §4.1). A
  # promotion to prod is a PR that changes this line and nothing else, and §8.1's
  # manual rollback is reverting that commit.
  #
  # §3 prefers a digest over a tag ("promotion is by digest, not rebuild"), so
  # the bot may write `digest: sha256:…` here instead; the library takes the
  # digest in preference when both are present.
  tag: sha-0000000

config:
  env:
    # PLACEHOLDER (hostnames). THE PRODUCTION DOMAIN IS UNDECIDED.
    #
    # No document in eventa-docs names it. This file used to assert
    # `eventa.dev`, which devops-ci-cd.md §1.1 uses only for PR previews
    # (`pr-<n>.preview.eventa.dev`), while ../checkin and ../worker asserted
    # `eventa.co.th` — a domain that appears in eventa-docs only as test data
    # (06-testing/test-cases.md:503) — and ../web asserted
    # `www.eventa.invalid`. Three plausible-looking domains for one product, and
    # the CORS_ORIGINS below did not contain the host web is actually served on,
    # so every browser call from the SSR origin would have been rejected.
    #
    # All five charts now use the one placeholder zone `eventa.invalid`:
    # reserved by RFC 2606, resolving nowhere, so a forgotten value fails closed
    # and visibly instead of answering on a name nobody chose. ../web/values-prod.yaml
    # carries the reasoning in full. When the real domain is decided, change it
    # in all five charts in one commit.
    #
    # PUBLIC_API_URL has to be the address Stripe can actually reach, because
    # organizers paste it into their own Stripe dashboard to register a webhook
    # endpoint — eventa-api's env schema says why it cannot be derived from an
    # incoming request. Which is one more reason it cannot be guessed here.
    PUBLIC_WEB_URL: https://www.eventa.invalid
    PUBLIC_API_URL: https://api.eventa.invalid
    # The browser origins allowed to call the api, and it must be the origin web
    # is served from — ../web/values-prod.yaml's Ingress host, exactly. A
    # mismatch here is not a 403 anybody debugs quickly: the SSR render succeeds
    # server-side and the browser's follow-up calls fail on CORS.
    #
    # Production is also the one environment where this is not `*`: the api
    # serves credentialed requests (eventa-api/src/main.ts enables CORS with
    # credentials), and a wildcard origin with credentials is how one tenant's
    # page reads another's session.
    CORS_ORIGINS: https://www.eventa.invalid

    # PLACEHOLDER (object storage). Both are required with no default in
    # eventa-api/src/config/env.validation.ts — an upload has nowhere to go
    # without them — and both are outputs of the object-storage module (§1.1).
    #
    # Loud REPLACE_ tokens for both, which is the convention
    # ../checkin/values-prod.yaml argues for and this chart now shares: api and
    # checkin are the same image in the same namespace reading the same bucket
    # (§3.2), and `eventa-prod-uploads` read like a name somebody had chosen
    # while the region beside it was openly unset. A token that fails loudly if
    # it is ever reached beats a guess that looks authoritative.
    S3_BUCKET: REPLACE_WITH_UPLOADS_BUCKET
    S3_REGION: REPLACE_WITH_STORAGE_REGION

# devops-infrastructure.md §5: per-environment paths with least-privilege IAM
# per namespace, so a dev pod cannot read prod secrets. This path is the whole
# of that boundary — it is why the ExternalSecret cannot live in values.yaml.
#
# `dataFrom.extract` pulls every key at the path, so adding a credential in the
# secrets manager does not need a chart change: DATABASE_URL, REDIS_URL,
# RABBITMQ_URL, JWT_SECRET, SECRET_ENCRYPTION_KEY and the comms tokens all
# arrive as env vars named after their keys.
externalSecret:
  enabled: true
  dataFrom:
    - extract:
        key: /eventa/prod/api

# The workload-identity binding that authorises the above goes in
# serviceAccount.annotations, and is left unset on purpose: the annotation key
# is cloud-specific (§1.1 writes "IRSA/workload-identity" to cover both), so
# writing one here would commit this repo to a provider nobody has chosen. Add
# it in this file when the cluster exists.

ingress:
  enabled: true
  # Left to the cluster's default IngressClass. The controller runs in
  # `platform` (§3.1) and is not named by any document, so naming one here would
  # be a guess that fails closed — an Ingress with an unknown class is ignored
  # by every controller.
  hosts:
    # PLACEHOLDER, in the one undecided-domain zone all five charts use — see
    # config.env above. `.invalid` resolves nowhere (RFC 2606), so a forgotten
    # value leaves the api unreachable and obviously so.
    - host: api.eventa.invalid
      paths:
        - path: /
          pathType: Prefix
  # No `tls` block: §2 terminates TLS at the edge (CDN/WAF) and again at the
  # public load balancer, so a certificate at this hop would be a third one
  # nobody renews.

networkPolicy:
  egress:
    # §3.3's api → Postgres/Redis/RabbitMQ. §2 puts all three in private data
    # subnets as managed services — not pods — so each allow is an ipBlock. The
    # toggles sit in the overlay beside the list because a store enabled with no
    # CIDR is a render error. See values-dev.yaml for what
    # templates/_validate.tpl requires of an environment render.
    postgres:
      enabled: true
    redis:
      enabled: true
    rabbitmq:
      enabled: true

# The data subnets for eventa-prod: 10.<env>.<az>.0/24 with the env octet 40,
# and all three availability zones. The scheme, shared by all five charts, is in
# values.yaml; production lists every zone because §4 gives Postgres automatic
# failover to a multi-AZ standby and RabbitMQ a three-node cluster, so the
# endpoint moves between zones and a one-zone allow works until the first
# failover — at which point the NetworkPolicy is the last place anyone looks.
#
# PLACEHOLDER. These are the `data subnet` outputs of the network module for
# this environment (§1.1), which has not been written; replace the lists
# wholesale in the change that creates it. Production used to carry 10.30.x
# here, which ../relay/values-uat.yaml also claimed — so one range named two
# environments' databases.
global:
  eventa:
    network:
      postgresCidrs:
        - 10.40.1.0/24
        - 10.40.2.0/24
        - 10.40.3.0/24
      redisCidrs:
        - 10.40.1.0/24
        - 10.40.2.0/24
        - 10.40.3.0/24
      rabbitmqCidrs:
        - 10.40.1.0/24
        - 10.40.2.0/24
        - 10.40.3.0/24

canary:
  analysis:
    # PLACEHOLDER (metric sink). devops-observability-sre.md §1 runs the
    # Prometheus/metric sink in the `platform` namespace (§3.1); this is its
    # in-cluster address. Every gate in values.yaml queries it, and an
    # unreachable address aborts deploys for reasons unrelated to the build —
    # which is why _validate.tpl refuses to render an environment without it.
    prometheusAddress: http://prometheus-server.platform.svc.cluster.local:9090
