# api — staging (namespace `eventa-staging`, devops-infrastructure.md §3.1/§7).
#
# §7 calls staging "prod-like" and puts DAST (OWASP ZAP), perf and **migration
# rehearsal** here, so this file changes as little as possible from the prod
# baseline in values.yaml. The canary analysis in particular stays on: staging
# is where a gate that is mis-written gets found, and finding it in prod means
# finding it by having every deploy stall at 10% of checkout traffic.
#
# The one deliberate departure from parity is the replica count. §8 (FinOps)
# asks non-prod to run smaller replica counts, and §7 lists replica count as one
# of the four things environments are allowed to differ in.
#
# PLACEHOLDERS are tagged as in values-prod.yaml and mean the same thing: an
# output of a Terraform module that has not been run, in a repo with no
# `terraform/` yet.

environment: staging

image:
  # PLACEHOLDER. Bot-managed. §4.1 auto-promotes dev → staging, so this line
  # moves without a human approving it; the approval gates are UAT and prod.
  tag: sha-0000000

# §8: non-prod runs smaller. Two is the smallest floor that keeps the rest of
# the chart honest — a 50% PodDisruptionBudget (§3.3) still permits one
# disruption, and a canary step still has a stable pod to compare against, which
# a single-replica staging would not. Below two, a DAST run or a perf test would
# be measuring a topology production does not have.
hpa:
  minReplicas: 2
  maxReplicas: 10

config:
  env:
    PUBLIC_WEB_URL: https://staging.eventa.dev
    PUBLIC_API_URL: https://api.staging.eventa.dev
    CORS_ORIGINS: https://staging.eventa.dev
    # PLACEHOLDER (object storage). Loud REPLACE_ tokens rather than plausible
    # names — see values-dev.yaml for why, and ../checkin/values-prod.yaml for
    # the argument this chart adopted. A separate bucket per environment is
    # still the requirement when these are filled in, because §7 forbids raw
    # prod PII outside production and a shared bucket would put attendee uploads
    # in reach of a DAST run.
    S3_BUCKET: REPLACE_WITH_UPLOADS_BUCKET
    S3_REGION: REPLACE_WITH_STORAGE_REGION

externalSecret:
  enabled: true
  dataFrom:
    - extract:
        key: /eventa/staging/api

ingress:
  enabled: true
  hosts:
    - host: api.staging.eventa.dev
      paths:
        - path: /
          pathType: Prefix

networkPolicy:
  egress:
    # §3.3's api → Postgres/Redis/RabbitMQ. See values-dev.yaml for why the
    # toggles sit in the overlay next to the list rather than in values.yaml.
    postgres:
      enabled: true
    redis:
      enabled: true
    rabbitmq:
      enabled: true

# The data subnets for eventa-staging: 10.<env>.<az>.0/24 with the env octet 20,
# AZ 1 alone because §8 runs the non-production environments on single-node data
# services. The scheme, shared by all five charts, is in values.yaml.
# PLACEHOLDER — the network module's output for this environment (§1.1).
#
# Staging's octet is disjoint from production's on purpose. This file used to go
# further and call these lists "the only thing stopping a staging pod from
# reaching the production database", which was wrong twice over: §2 reaches the
# data tier "only from app subnets via NetworkPolicy + security groups", so the
# policy is one of two controls rather than the only one — and the claim was
# falsified by the charts themselves, because ../checkin/values-staging.yaml
# listed 10.30.x for staging while ../api/values-prod.yaml listed 10.30.x for
# production. One of staging's own allow lists named production's range.
#
# What is true is narrower and worth keeping: a disjoint range is a control for
# exactly as long as every chart in the environment agrees on the scheme. That
# is why the scheme is now stated in all five charts and why the octets are
# assigned once.
global:
  eventa:
    network:
      postgresCidrs:
        - 10.20.1.0/24
      redisCidrs:
        - 10.20.1.0/24
      rabbitmqCidrs:
        - 10.20.1.0/24

canary:
  analysis:
    # PLACEHOLDER (metric sink) — the Prometheus in this cluster's `platform`
    # namespace (§3.1).
    prometheusAddress: http://prometheus-server.platform.svc.cluster.local:9090
