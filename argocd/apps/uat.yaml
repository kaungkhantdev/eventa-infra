# UAT's root: the Application that owns the five service Applications in
# `argocd/environments/uat`.
#
# UAT is gated, and it is worth being precise about where. devops-ci-cd.md §4.1
# gates UAT on a "manual approval (PO/QA)" of the *promotion*, while §1.3 and
# §4.1 reserve a gated *sync* for production alone ("prod sync is gated
# (manual/approved)"). So the approval that holds a build out of UAT is the
# approval on the PR that moves the image tag in
# `deploy/charts/<service>/values-uat.yaml`; once that PR is merged there is
# nothing further to approve, and these children sync themselves like dev's
# and staging's.
#
# ALL FIVE CHILDREN SYNC. Every chart now ships a `values-uat.yaml`, so each of
# the five Applications in `argocd/environments/uat` resolves its `valueFiles`
# and renders: web 8 objects, api 12, checkin 9, worker 7, relay 6 — the same
# counts as staging and prod. ../README.md, "Verifying a change", has the loop
# that checks this.
#
# `checkin` and `worker` were the last two. Both were built with dev, staging and
# prod only and reported "values file does not exist" on every sync attempt;
# their Applications' own headers record what that cost each of them. The
# references were kept through that period rather than quieted with
# `ignoreMissingValueFiles`, which was a choice about the error message and not
# about safety:
#
#   * Neither chart could have rendered a baseline into `eventa-uat` even with
#     the flag set. Both refuse on `values.yaml` alone, failing their values
#     schema at `/image` with "'anyOf' failed" — `checkin` reporting "missing
#     property 'tag'" and "missing property 'digest'", `worker` reporting "at
#     '/image/tag': minLength: got 0, want 1" alongside the same missing
#     `digest`. (`api`, before it had an overlay, got past the schema and failed
#     in its templates on `canary.analysis.prometheusAddress`.)
#   * No baseline carries a secret path either. §5 makes
#     `externalSecret.dataFrom` per-environment, so it is deliberately absent
#     from every chart's `values.yaml`; `checkin`'s and `worker`'s baselines
#     enable `externalSecret` with no path, which the library refuses outright.
#
# Both refusals still stand, which is what makes a deleted or renamed overlay a
# failed render rather than a baseline-only deploy. Leave `ignoreMissingValueFiles`
# unset: it would trade an error that names a missing file for one that names a
# path in a JSON Schema, and the first is the one that tells the reader what to do.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eventa-uat
  namespace: platform
spec:
  project: platform

  source:
    repoURL: https://github.com/kaungkhantdev/eventa-infra.git
    targetRevision: main
    path: argocd/environments/uat
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
