# UAT's root: the Application that owns the five service Applications in
# `argocd/environments/uat`.
#
# UAT is gated, and it is worth being precise about where. devops-ci-cd.md §4.1
# gates UAT on a "manual approval (PO/QA)" of the *promotion*, while §1.3 and
# §4.1 reserve a gated *sync* for production alone ("prod sync is gated
# (manual/approved)"). So the approval that holds a build out of UAT is the
# approval on the PR that moves the image tag in
# `deploy/charts/<service>/values-uat.yaml`; once that PR is merged there is
# nothing further to approve, and these children sync themselves like dev's
# and staging's.
#
# THREE OF THE FIVE CHILDREN CANNOT SYNC TODAY. `api`, `checkin` and `worker`
# have no `values-uat.yaml`, so their Applications fail with "values file does
# not exist" until someone writes one. That failure is deliberate and is
# explained in ../README.md — the alternative, `ignoreMissingValueFiles`, would
# render those three charts' production baselines into `eventa-uat`, secret
# paths and all.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eventa-uat
  namespace: platform
spec:
  project: platform

  source:
    repoURL: https://github.com/kaungkhantdev/eventa-infra.git
    targetRevision: main
    path: argocd/environments/uat
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
