# checkin — the door-scan pool: the SAME `api` image in its own Deployment and
# HPA (devops-infrastructure.md §3.2).
#
# The separation is the deliverable, and it only exists because this is a
# second Application with a second chart: a door-scanning surge at a live event
# scales and fails here without touching the pool serving browse and checkout.
# One tenant's on-site rush cannot starve another tenant's checkout.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The Application name carries the environment because all four environments'
  # Applications live in the one `platform` namespace (§3.1); the Helm release
  # name below deliberately does not.
  name: eventa-prod-checkin
  namespace: platform
spec:
  project: eventa-prod

  source:
    repoURL: https://github.com/kaungkhantdev/eventa-infra.git
    targetRevision: main
    path: deploy/charts/checkin
    helm:
      # Not the Application name — see ../../README.md, "Release names".
      releaseName: checkin
      # Helm always reads the chart's own values.yaml as the base, so only the
      # overlay is listed. devops-infrastructure.md §1.2 makes this pair the
      # unit of deployment, and the image tag inside the overlay is what a
      # promotion moves — which is why there are no `helm.parameters` here.
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: eventa-prod

  syncPolicy:
    # No `automated` block. devops-ci-cd.md §4.1 and devops-infrastructure.md
    # §1.3 both gate the production sync on a human: a merged promotion leaves
    # this Application OutOfSync until the release manager syncs it. See
    # ../../apps/prod.yaml for why self-heal cannot also be on here.
    syncOptions:
      - CreateNamespace=true
