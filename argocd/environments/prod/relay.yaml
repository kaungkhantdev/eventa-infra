# relay — the transactional outbox publisher, pinned to exactly one replica.
#
# devops-infrastructure.md §3.2 tabulates a minimum of 2 and that entry is
# wrong: the reader takes no row lock
# (eventa-relay/src/relay/outbox-reader.repository.ts:25), so a second replica
# republishes every row. Nothing in this Application enforces that — the chart
# does, and it refuses to render if the replica count is raised. There is
# deliberately no Argo CD parameter here that could reach `replicas`, which
# would be the one way to get a second publisher past the chart's guard.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The Application name carries the environment because all four environments'
  # Applications live in the one `platform` namespace (§3.1); the Helm release
  # name below deliberately does not.
  name: eventa-prod-relay
  namespace: platform
spec:
  project: eventa-prod

  source:
    repoURL: https://github.com/kaungkhantdev/eventa-infra.git
    targetRevision: main
    path: deploy/charts/relay
    helm:
      # Not the Application name — see ../../README.md, "Release names".
      releaseName: relay
      # Helm always reads the chart's own values.yaml as the base, so only the
      # overlay is listed. devops-infrastructure.md §1.2 makes this pair the
      # unit of deployment, and the image tag inside the overlay is what a
      # promotion moves — which is why there are no `helm.parameters` here.
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: eventa-prod

  syncPolicy:
    # No `automated` block. devops-ci-cd.md §4.1 and devops-infrastructure.md
    # §1.3 both gate the production sync on a human: a merged promotion leaves
    # this Application OutOfSync until the release manager syncs it. See
    # ../../apps/prod.yaml for why self-heal cannot also be on here.
    #
    # ONE CONSEQUENCE SPECIFIC TO THIS APPLICATION. No `automated` means no
    # `selfHeal`, so there is no automatic drift reversion here — and the chart's
    # singleton guard is a render-time guard, which a `kubectl scale` never
    # reaches. In eventa-dev, eventa-staging and eventa-uat self-heal would put a
    # hand-scaled relay back to the chart's literal 1; in eventa-prod nothing
    # does. `kubectl scale deployment/relay -n eventa-prod --replicas=2` will
    # therefore start a second publisher against the same unlocked outbox rows
    # and double-publish every event until somebody notices the Application is
    # OutOfSync. This is the one environment where that reaches a paying buyer,
    # and it is the one with no net under it. Scale this Deployment to 0 for a
    # maintenance window and restore it by SYNCING this Application; never scale
    # it above 1. deploy/charts/relay/README.md has the procedure.
    syncOptions:
      - CreateNamespace=true
