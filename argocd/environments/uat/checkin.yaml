# THIS APPLICATION CANNOT SYNC YET. deploy/charts/checkin has no
# values-uat.yaml, so the `valueFiles` entry below resolves to nothing and
# Argo CD reports "values file does not exist" instead of deploying.
#
# The reference stays anyway, because that error names the fix. `web` and
# `relay` both ship a values-uat.yaml and both explain in its header why a
# fourth overlay was needed; these three charts were built with dev, staging and
# prod only.
#
# Nothing here is unsafe either way. This chart refuses to render on
# `values.yaml` alone — it fails its values schema on the missing `image.tag` —
# so there is no baseline-only manifest that could land in `eventa-uat`. But
# that refusal reports a JSON Schema path, while a missing-file error names the
# file that is missing.
#
# Do not reach for `ignoreMissingValueFiles` to quiet this: it would not make
# the Application sync, only swap the message that names the file for the one
# that does not. ../../apps/uat.yaml records that in full.
# ../../README.md says what the overlay has to contain.

# checkin — the door-scan pool: the SAME `api` image in its own Deployment and
# HPA (devops-infrastructure.md §3.2).
#
# The separation is the deliverable, and it only exists because this is a
# second Application with a second chart: a door-scanning surge at a live event
# scales and fails here without touching the pool serving browse and checkout.
# One tenant's on-site rush cannot starve another tenant's checkout.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The Application name carries the environment because all four environments'
  # Applications live in the one `platform` namespace (§3.1); the Helm release
  # name below deliberately does not.
  name: eventa-uat-checkin
  namespace: platform
spec:
  project: eventa-uat

  source:
    repoURL: https://github.com/kaungkhantdev/eventa-infra.git
    targetRevision: main
    path: deploy/charts/checkin
    helm:
      # Not the Application name — see ../../README.md, "Release names".
      releaseName: checkin
      # Helm always reads the chart's own values.yaml as the base, so only the
      # overlay is listed. devops-infrastructure.md §1.2 makes this pair the
      # unit of deployment, and the image tag inside the overlay is what a
      # promotion moves — which is why there are no `helm.parameters` here.
      valueFiles:
        - values-uat.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: eventa-uat

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
