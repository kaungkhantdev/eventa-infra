# This Application syncs. `deploy/charts/checkin/values-uat.yaml` exists, so the
# `valueFiles` entry below resolves and `helm template checkin
# deploy/charts/checkin -f deploy/charts/checkin/values-uat.yaml -n eventa-uat`
# renders — 9 objects, the same count as staging and prod.
#
# It did not always. This chart was built with dev, staging and prod only, and
# for a while this Application reported "values file does not exist" on every
# sync attempt. The reference was kept through that period rather than quieted
# with `ignoreMissingValueFiles`, because the missing-file error named the fix
# and the flag would only have swapped it for a JSON Schema path. That overlay
# now exists and its header records what it had to settle.
#
# All four of §7's parity environments now have an overlay in this chart, so
# every one of UAT's five Applications renders. What is still a placeholder here
# is what is a placeholder in every environment — the image tag until the first
# promotion, the data-subnet CIDRs and the object-storage coordinates until the
# Terraform modules exist (§1.1). ../../README.md, "Known gaps", has the list.
#
# The chart still refuses to render on `values.yaml` alone: the baseline fails
# its values schema at `/image` with "'anyOf' failed", reporting both "missing
# property 'tag'" and "missing property 'digest'". So a deleted or renamed
# overlay cannot degrade into a baseline-only manifest landing in `eventa-uat` —
# it fails the render instead.
# ../../README.md says what the overlay has to contain.

# checkin — the door-scan pool: the SAME `api` image in its own Deployment and
# HPA (devops-infrastructure.md §3.2).
#
# The separation is the deliverable, and it only exists because this is a
# second Application with a second chart: a door-scanning surge at a live event
# scales and fails here without touching the pool serving browse and checkout.
# One tenant's on-site rush cannot starve another tenant's checkout.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The Application name carries the environment because all four environments'
  # Applications live in the one `platform` namespace (§3.1); the Helm release
  # name below deliberately does not.
  name: eventa-uat-checkin
  namespace: platform
spec:
  project: eventa-uat

  source:
    repoURL: https://github.com/kaungkhantdev/eventa-infra.git
    targetRevision: main
    path: deploy/charts/checkin
    helm:
      # Not the Application name — see ../../README.md, "Release names".
      releaseName: checkin
      # Helm always reads the chart's own values.yaml as the base, so only the
      # overlay is listed. devops-infrastructure.md §1.2 makes this pair the
      # unit of deployment, and the image tag inside the overlay is what a
      # promotion moves — which is why there are no `helm.parameters` here.
      valueFiles:
        - values-uat.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: eventa-uat

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
