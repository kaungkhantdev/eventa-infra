# This Application syncs. `deploy/charts/api/values-uat.yaml` exists, so the
# `valueFiles` entry below resolves and `helm template api deploy/charts/api -f
# deploy/charts/api/values-uat.yaml -n eventa-uat` renders.
#
# It did not always. For a while this chart had no UAT overlay and this
# Application reported "values file does not exist", which had a consequence
# beyond the api itself: the namespace-wide default-deny NetworkPolicy is
# namespace-scoped and ../../../deploy/charts/_library/README.md puts it on the
# api, the one chart every namespace runs. With no api release in `eventa-uat`,
# `web` and `relay` ran there with every pod-to-pod path open — the opposite of
# devops-infrastructure.md §3.3, arrived at by a missing file rather than by a
# decision. That chart's values-uat.yaml header records it.
#
# `checkin` and `worker` are still in that state. See ../../README.md,
# "Known gaps", and ../../apps/uat.yaml.

# api — the core API, and the only chart of the five that is deployed
# progressively (devops-ci-cd.md §4.2): its workload object is an Argo Rollouts
# Rollout stepping 10% → 25% → 50%, with an AnalysisTemplate gating each step.
#
# It also carries the gated pre-deploy migration Job (§5.1). The Job is a
# PreSync hook inside this chart with `backoffLimit: 0`, so a failed migration
# halts this Application's sync and no api pod starts against an un-migrated
# schema. eventa-api owns every migration; the other four charts ship none.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The Application name carries the environment because all four environments'
  # Applications live in the one `platform` namespace (§3.1); the Helm release
  # name below deliberately does not.
  name: eventa-uat-api
  namespace: platform
spec:
  project: eventa-uat

  source:
    repoURL: https://github.com/kaungkhantdev/eventa-infra.git
    targetRevision: main
    path: deploy/charts/api
    helm:
      # Not the Application name — see ../../README.md, "Release names".
      releaseName: api
      # Helm always reads the chart's own values.yaml as the base, so only the
      # overlay is listed. devops-infrastructure.md §1.2 makes this pair the
      # unit of deployment, and the image tag inside the overlay is what a
      # promotion moves — which is why there are no `helm.parameters` here.
      valueFiles:
        - values-uat.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: eventa-uat

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
