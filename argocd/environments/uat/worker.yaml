# This Application syncs. `deploy/charts/worker/values-uat.yaml` exists, so the
# `valueFiles` entry below resolves and `helm template worker
# deploy/charts/worker -f deploy/charts/worker/values-uat.yaml -n eventa-uat`
# renders — 7 objects, the same count as every other environment.
#
# It did not always. This chart was built with dev, staging and prod only, and
# for a while this Application reported "values file does not exist" on every
# sync attempt — which mattered beyond the worker itself, because this image is
# what declares and binds the `eventa.worker` queue. With no consumer in the
# namespace a stakeholder's registration produced a green page and no email: the
# api wrote its outbox row and the relay published it, and the topic exchange had
# nothing to route to. That overlay now exists and its header records the whole
# chain.
#
# The reference was kept through that period rather than quieted with
# `ignoreMissingValueFiles`, because the missing-file error named the fix and the
# flag would only have swapped it for a JSON Schema path.
#
# All four of §7's parity environments now have an overlay in this chart, so
# every one of UAT's five Applications renders. What is still a placeholder here
# is what is a placeholder in every environment — the image tag until the first
# promotion, the data-subnet CIDRs until the Terraform network module exists, and
# `serviceAccount.annotations`, which stays empty because §1.1 names the
# workload-identity mechanism without naming a cloud. ../../README.md, "Known
# gaps", has the list.
#
# The chart still refuses to render on `values.yaml` alone: the baseline fails
# its values schema at `/image` with "'anyOf' failed", reporting "at
# '/image/tag': minLength: got 0, want 1" alongside "missing property 'digest'".
# So a deleted or renamed overlay cannot degrade into a baseline-only manifest
# landing in `eventa-uat` — it fails the render instead.
# ../../README.md says what the overlay has to contain.

# worker — the RabbitMQ consumers: notifications, calendar, indexing
# (devops-infrastructure.md §3.2), scaling on CPU and queue depth.
#
# It keeps typed mirrors of tables `eventa-api` owns, so the migration that a
# mirror depends on must land in an earlier release than the mirror that uses
# it (devops-ci-cd.md §5.2, and warning 3 in the repository README). Argo CD
# cannot order this Application against the api's — see README.md, "What sync
# waves can and cannot order here".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # The Application name carries the environment because all four environments'
  # Applications live in the one `platform` namespace (§3.1); the Helm release
  # name below deliberately does not.
  name: eventa-uat-worker
  namespace: platform
spec:
  project: eventa-uat

  source:
    repoURL: https://github.com/kaungkhantdev/eventa-infra.git
    targetRevision: main
    path: deploy/charts/worker
    helm:
      # Not the Application name — see ../../README.md, "Release names".
      releaseName: worker
      # Helm always reads the chart's own values.yaml as the base, so only the
      # overlay is listed. devops-infrastructure.md §1.2 makes this pair the
      # unit of deployment, and the image tag inside the overlay is what a
      # promotion moves — which is why there are no `helm.parameters` here.
      valueFiles:
        - values-uat.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: eventa-uat

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
